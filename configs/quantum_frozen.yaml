# Reproducible configuration for runs/densenet_quantum_15ep_frozen.
# This is the QCA reference matched by the SE and no-attention controls.

data_root: asl-dataset
output_dir: runs/densenet_quantum_15ep_frozen

# Training
epochs: 15
batch_size: 32
lr: 1.0e-3
weight_decay: 1.0e-4
img_size: 224

# Data splits
val_frac: 0.1
test_frac: 0.1
seed: 42
num_workers: 4

# Backbone
backbone: densenet
pretrained: true
freeze_backbone: true

# Quantum attention
n_qubits: 8
n_layers: 2
pennylane_device: default.qubit
