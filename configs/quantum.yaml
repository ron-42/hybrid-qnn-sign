# Phase 2: DenseNet121 + QuantumChannelAttention
# Usage:
#   python -m src.train_quantum --config configs/quantum.yaml
#   make quantum

data_root: asl-dataset
output_dir: runs/densenet_quantum

# Training — smaller batch: quantum forward pass is slower than classical
epochs: 15
batch_size: 32
lr: 3.0e-4
weight_decay: 1.0e-4
img_size: 224

# Data splits
val_frac: 0.1
test_frac: 0.1
seed: 42
num_workers: 4

# Backbone — freeze first; unfreeze only if quantum layer learns well
pretrained: true
freeze_backbone: false

# Quantum attention block
n_qubits: 8
n_layers: 2
# Swap to lightning.qubit + adjoint diff for larger n_qubits (needs pennylane-lightning)
pennylane_device: default.qubit
