# ResNet50 + QuantumChannelAttention, matched to the DenseNet quantum setup.
# Usage: make resnet-quantum DATA_ROOT=asl-dataset

data_root: asl-dataset
output_dir: runs/resnet_quantum

# Training
epochs: 15
batch_size: 32
lr: 3.0e-4
weight_decay: 1.0e-4
img_size: 224

# Data splits
val_frac: 0.1
test_frac: 0.1
seed: 42
num_workers: 4

# Backbone
backbone: resnet
pretrained: true
freeze_backbone: false

# Quantum attention block
n_qubits: 8
n_layers: 2
pennylane_device: default.qubit
