# 10% train-only low-data pilot: frozen DenseNet121 + SE, seed 42.

data_root: asl-dataset
output_dir: runs/low_data_10pct_se_seed42

epochs: 15
batch_size: 32
lr: 1.0e-3
weight_decay: 1.0e-4
img_size: 224

val_frac: 0.1
test_frac: 0.1
split_seed: 42
train_fraction: 0.1
seed: 42
num_workers: 4

pretrained: true
freeze_backbone: true
attention_type: se
reduction: 16
